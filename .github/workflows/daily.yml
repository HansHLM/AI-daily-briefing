name: AI Daily Brief

on:
  schedule:
    # Cron draait in UTC, en GitHub start geplande runs soms veel later dan
    # gepland of slaat ze over. Daarom zes kansen per ochtend (niet op het hele
    # uur, dan is het het drukst). Het script maakt de aflevering bij de eerste
    # run na 6:00 Nederlandse tijd; de rest ziet dat die er al is en stopt.
    - cron: "17,47 4-6 * * *"   # 5:17–7:47 winter / 6:17–8:47 zomer
  workflow_dispatch:       # handmatig starten via het tabblad Actions
    inputs:
      force:
        description: "Nu genereren (tijdcheck overslaan)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # vaste versie: geen verrassingen bij de overstap naar Ubuntu 26
    timeout-minutes: 15
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Aflevering maken
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE: ${{ inputs.force }}
        run: python bulletin.py

      - name: Site klaarzetten
        if: steps.run.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-24.04   # vaste versie: geen verrassingen bij de overstap naar Ubuntu 26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
